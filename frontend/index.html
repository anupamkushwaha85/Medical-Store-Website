<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="description"
        content="Jaya Medical Store is a modern medical and pharma e-commerce experience for medicines, wellness, baby care, and surgical supplies." />
    <meta property="og:title" content="Jaya Medical Store" />
    <meta property="og:description"
        content="Your health, our priority. Browse genuine medicines, upload prescriptions, and order from a trusted neighborhood pharmacy." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />
    <title>Jaya Medical Store</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).filter(function(s) {
            return s.slice(0, 2) === 'p='
          })[0].slice(2);
          var q = l.search.slice(1).split('&').filter(function(s) {
            return s.slice(0, 2) === 'q='
          })[0];
          var search = q ? '?' + decodeURIComponent(q.slice(2)) : '';
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decodeURIComponent(decoded) + search + l.hash
          );
        }
      }(window.location));
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
